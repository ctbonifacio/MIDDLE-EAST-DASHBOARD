<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10263c">
  <title>Middle East SPMadrid Performance</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      font-family: "DM Sans", "Trebuchet MS", sans-serif;
      font-synthesis: none;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      background: radial-gradient(ellipse at 92% 3%, rgba(39,116,200,.08), transparent 28rem), linear-gradient(135deg,#f8fafb 0%,#f3f6f8 55%,#eef4f3 100%);
    }
    a:focus-visible { outline: 3px solid #45b7aa; outline-offset: 4px; }
    .shell { max-width: 1600px; margin: 0 auto; padding: 20px 24px; }
    .topbar { display: flex; align-items: center; gap: 14px; padding: 18px 22px; color: #fff; border-radius: 8px; background: linear-gradient(105deg,#10263c,#173b58 73%,#145c5b); box-shadow: 0 8px 24px rgba(17,43,66,.12); }
    .brand-mark { display: block; position: relative; width: 46px; height: 30px; flex: 0 0 auto; overflow: hidden; border: 1px solid rgba(255,255,255,.35); border-radius: 3px; background: linear-gradient(to bottom,#009a49 0 33.33%,#fff 33.33% 66.66%,#111 66.66% 100%); }
    .brand-mark::before { position: absolute; inset: 0 auto 0 0; width: 12px; background: #ed2939; content: ""; }
    .identity { min-width: 0; }
    h1 { margin: 0; font-family: "Barlow Condensed","Arial Narrow",sans-serif; font-size: clamp(24px,3vw,36px); line-height: 1; font-weight: 800; text-transform: uppercase; }
    .menu-list { display: grid; justify-items: start; gap: 15px; margin: 30px 12px; padding: 0; list-style: none; }
    .menu-list a { color: #173b58; font-family: "Barlow Condensed","Arial Narrow",sans-serif; font-size: 21px; font-weight: 700; text-decoration: none; text-transform: uppercase; }
    .menu-list a:hover, .menu-list a[aria-current="location"] { color: #087c72; }
    .menu-list a:focus-visible { outline: 2px solid #45b7aa; outline-offset: 4px; }
    #ptp-file-input { display: none; }
    .preview-dialog { width: min(1000px, calc(100vw - 32px)); max-height: calc(100vh - 32px); margin: auto; padding: 22px; border: 0; border-radius: 8px; color: #122a40; background: #f8fafb; box-shadow: 0 18px 60px rgba(13,35,53,.28); }
    .preview-dialog::backdrop { background: rgba(11,28,43,.62); }
    .preview-heading { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 18px; margin-bottom: 12px; }
    .preview-heading h2 { color: #173b58; font-family: "Barlow Condensed","Arial Narrow",sans-serif; font-size: 21px; text-transform: uppercase; }
    .report-date { display: inline-flex; align-items: center; gap: 6px; color: #66798a; font-size: 11px; font-weight: 600; }
    .report-date[hidden] { display: none; }
    .report-date input { width: 138px; padding: 5px 7px; color: #263d51; border: 1px solid #d5dfe5; border-radius: 4px; background: #fff; font: inherit; }
    .preview-meta, .preview-message { color: #66798a; font-size: 12px; }
    .table-wrap { max-height: 65vh; overflow: auto; border: 1px solid #dce5eb; background: rgba(255,255,255,.92); }
    .preview-dialog table { width: 100%; border-collapse: collapse; font-size: 12px; text-align: left; }
    .preview-dialog th, .preview-dialog td { min-width: 110px; max-width: 300px; padding: 9px 11px; border-right: 1px solid #e6ecf0; border-bottom: 1px solid #e6ecf0; overflow-wrap: anywhere; }
    .preview-dialog th { position: sticky; top: 0; color: #fff; background: #173b58; font-weight: 600; }
    .preview-dialog td { color: #263d51; }
    .preview-dialog .agent-report { width: max-content; min-width: 100%; table-layout: auto; font-size: 10px; white-space: nowrap; }
    .preview-dialog .agent-report th, .preview-dialog .agent-report td { min-width: 72px; max-width: none; padding: 7px 8px; text-align: center; }
    .preview-dialog .agent-report thead tr:first-child th:first-child, .preview-dialog .agent-report tbody td:first-child { width: 110px; min-width: 110px; }
    .preview-dialog .agent-report thead tr:first-child th:nth-child(2), .preview-dialog .agent-report tbody td:nth-child(2) { width: 155px; min-width: 155px; text-align: left; }
    .preview-dialog .agent-report thead tr:first-child th { top: 0; }
    .preview-dialog .agent-report thead tr:nth-child(2) th { top: 29px; }
    .preview-dialog .agent-report .group-heading { background: #10263c; text-align: center; text-transform: uppercase; }
    .preview-dialog .bank-report { width: max-content; min-width: 100%; table-layout: auto; font-size: 11px; white-space: nowrap; }
    .preview-dialog .bank-report th, .preview-dialog .bank-report td { min-width: 90px; max-width: none; padding: 7px 8px; text-align: center; }
    .preview-dialog .bank-report thead tr:first-child th { top: 0; }
    .preview-dialog .bank-report thead tr:nth-child(2) th { top: 29px; }
    .preview-dialog .bank-report .group-heading { background: #10263c; text-align: center; text-transform: uppercase; }
    .preview-dialog .bank-report tbody td:first-child { min-width: 120px; }
    .preview-dialog .bank-reference { width: max-content; min-width: 100%; table-layout: auto; font-size: 11px; }
    .preview-dialog .bank-reference th { min-width: 130px; text-align: center; }
    .preview-dialog .bank-reference thead th { top: 0; background: #10263c; text-transform: uppercase; }
    .preview-dialog .bank-reference td { min-width: 150px; padding: 5px; vertical-align: top; }
    .preview-dialog .bank-reference td:nth-child(5), .preview-dialog .bank-reference td:nth-child(6) { min-width: 230px; }
    .bank-reference-input { display: block; width: 100%; min-height: 190px; padding: 7px; color: #263d51; border: 1px solid #d5dfe5; border-radius: 3px; background: #fff; font: inherit; line-height: 1.6; resize: vertical; }
    .bank-reference-input:focus { border-color: #087c72; outline: 2px solid rgba(8,124,114,.18); }
    .bank-choice { min-width: 150px; padding: 5px 7px; color: #263d51; border: 1px solid #d5dfe5; border-radius: 4px; background: #fff; font: inherit; }
    .agent-entry-input { display: block; width: 100%; min-width: 0; max-width: 100%; padding: 6px 7px; color: #263d51; border: 1px solid #d5dfe5; border-radius: 3px; background: #fff; font: inherit; }
    .agent-entry-input:focus { border-color: #087c72; outline: 2px solid rgba(8,124,114,.18); }
    .bank-entry-input { width: 100%; min-width: 76px; padding: 6px; color: #263d51; border: 1px solid #d5dfe5; border-radius: 3px; background: #fff; font: inherit; text-align: right; }
    .bank-entry-input:focus { border-color: #087c72; outline: 2px solid rgba(8,124,114,.18); }
    .confirm-row { padding: 7px 9px; color: #fff; border: 1px solid #087c72; border-radius: 4px; background: #087c72; cursor: pointer; font: inherit; font-size: 11px; font-weight: 700; }
    .delete-row { width: 28px; height: 28px; padding: 0; color: #a23c48; border: 1px solid #eccbd0; border-radius: 4px; background: #fff; cursor: pointer; font-size: 19px; line-height: 1; }
    .delete-row:hover { color: #fff; border-color: #a23c48; background: #a23c48; }
    .preview-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
    .modal-button { padding: 9px 15px; color: #173b58; border: 1px solid #cbd7df; border-radius: 5px; background: #fff; cursor: pointer; font-size: 12px; font-weight: 700; }
    .modal-button.primary { color: #fff; border-color: #087c72; background: #087c72; }
    @media (max-width: 600px) {
      .shell { padding: 12px; }
      .topbar { align-items: flex-start; padding: 15px; }
      h1 { font-size: 25px; }
      .menu-list { gap: 13px; margin: 24px 8px; }
      .menu-list a { font-size: 19px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <a class="brand-mark" href="index.html" aria-label="Return to Productivity"></a>
      <div class="identity">
        <h1>Middle East SPMadrid Performance</h1>
      </div>
    </header>
    <nav aria-label="Dashboard sections">
      <ul class="menu-list">
        <li><a id="ptp-inventory" href="#ptp-inventory">PTP Inventory</a></li>
        <li><a id="payment-inventory" href="#payment-inventory">Payment Inventory</a></li>
        <li><a id="daily-remarks" href="#daily-remarks">Daily Remarks</a></li>
        <li><a id="agent-details" href="#agent-details">Agent Details</a></li>
        <li><a id="bank-details" href="#bank-details">Bank Details</a></li>
        <li><a id="bank-reference" href="#bank-reference">Bank Reference</a></li>
      </ul>
    </nav>
    <input id="ptp-file-input" type="file" accept=".xlsx,.xls" aria-label="Choose an Excel file">
    <dialog class="preview-dialog" id="ptp-preview" aria-labelledby="preview-title">
      <div class="preview-heading">
        <h2 id="preview-title">PTP Inventory Preview</h2>
        <p class="preview-meta" id="preview-meta"></p>
        <label class="report-date" id="agent-date-control" hidden>Date <input id="agent-report-date" type="date" aria-label="Agent Details report date"></label>
        <label class="report-date" id="bank-month-control" hidden>Month <input id="bank-report-month" type="month" aria-label="Bank Details month"></label>
        <label class="report-date" id="bank-reference-choice-control" hidden>Bank Choices <select class="bank-choice" id="bank-reference-bank" aria-label="Bank Choices"></select></label>
        <button class="modal-button" id="close-preview" type="button">Close</button>
      </div>
      <p class="preview-message" id="preview-message" role="status" aria-live="polite"></p>
      <div class="table-wrap" id="preview-table-wrap" hidden>
        <table id="preview-table">
          <thead id="preview-head"></thead>
          <tbody id="preview-body"></tbody>
        </table>
      </div>
      <div class="preview-actions">
        <button class="modal-button" id="add-agent-row" type="button" hidden>Add row</button>
        <button class="modal-button primary" id="calculate-agent-details" type="button" hidden>Calculate</button>
        <button class="modal-button primary" id="replace-file" type="button">Replace</button>
      </div>
    </dialog>
  </main>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <script>
    const menuLinks = [...document.querySelectorAll('.menu-list a')];
    const fileInput = document.querySelector('#ptp-file-input');
    const preview = document.querySelector('#ptp-preview');
    const previewTitle = document.querySelector('#preview-title');
    const previewMeta = document.querySelector('#preview-meta');
    const previewMessage = document.querySelector('#preview-message');
    const previewTableWrap = document.querySelector('#preview-table-wrap');
    const previewTable = document.querySelector('#preview-table');
    const agentDateControl = document.querySelector('#agent-date-control');
    const agentReportDate = document.querySelector('#agent-report-date');
    const bankMonthControl = document.querySelector('#bank-month-control');
    const bankReportMonth = document.querySelector('#bank-report-month');
    const bankReferenceChoiceControl = document.querySelector('#bank-reference-choice-control');
    const bankReferenceBank = document.querySelector('#bank-reference-bank');
    const previewHead = document.querySelector('#preview-head');
    const previewBody = document.querySelector('#preview-body');
    const calculateButton = document.querySelector('#calculate-agent-details');
    const addAgentRowButton = document.querySelector('#add-agent-row');
    const replaceButton = document.querySelector('#replace-file');
    const closeButton = document.querySelector('#close-preview');
    const agentEntriesStorageKey = 'middle-east-agent-details-rows';
    const agentDateStorageKey = 'middle-east-agent-details-date';
    const dailyRemarksWaStorageKey = 'middle-east-daily-remarks-wa-counts';
    const bankDetailsStorageKey = 'middle-east-bank-details-monthly';
    const bankReferenceStorageKey = 'middle-east-bank-references';
    const bankReferenceCategories = [
      {
        key: 'partialPayment',
        label: 'Partial Payment',
        defaults: ['CALL_PAYMENT - SPP INSTALLMENT', 'EMAIL_PAYMENT - SPP INSTALLMENT'],
      },
      {
        key: 'partialPtp',
        label: 'Partial PTP',
        defaults: ['CALL_PTP - SPP INSTALLMENT', 'EMAIL_PTP - SPP INSTALLMENT'],
      },
      {
        key: 'sppPayment',
        label: 'SPP Payment',
        defaults: [
          'CALL_PAYMENT - SPP OTP',
          'CALL_PAYMENT - PARTIAL',
          'EMAIL_PAYMENT - SPP OTP',
          'EMAIL_PAYMENT - PARTIAL',
        ],
      },
      {
        key: 'sppPtp',
        label: 'SPP PTP',
        defaults: [
          'CALL_PTP - SPP OTP',
          'CALL_PTP - PARTIAL',
          'EMAIL_PTP - SPP OTP',
          'EMAIL_PTP - PARTIAL',
        ],
      },
      {
        key: 'rpc',
        label: 'RPC',
        defaults: [
          'CALL_RPC - REQUEST SPP',
          'CALL_RPC - LAY OFF',
          'CALL_RPC - FRAUD CASE',
          'CALL_RPC - UNDER MEDICATION',
          'CALL_RPC - LOW SALARY',
          'CALL_RPC - LOW PRIORITY',
          'CALL_RPC - NO INTENTION',
          'CALL_RPC - BP',
          'EMAIL_RPC - REQUEST SPP',
          'EMAIL_RPC - LAY OFF',
          'EMAIL_RPC - FRAUD CASE',
          'EMAIL_RPC - UNDER MEDICATION',
          'EMAIL_RPC - LOW SALARY',
          'EMAIL_RPC - LOW PRIORITY',
          'EMAIL_RPC - NO INTENTION',
          'EMAIL_RPC - BP',
          'CALL_PTP - SPP OTP',
          'CALL_PTP - SPP INSTALLMENT',
          'CALL_PTP - PARTIAL',
        ],
      },
      {
        key: 'positive',
        label: 'Positive',
        defaults: [
          'CALL_POSITIVE - 3RD PARTY LEAVE MESSAGE',
          'CALL_POSITIVE - ACTIVE EMPLOYEE',
          'CALL_POSITIVE - FAILED PID',
          'EMAIL_POSITIVE - ACTIVE EMPLOYMENT STATUS',
          'EMAIL_POSITIVE - EMPLOYMENT STATUS FOLLOW UP',
          'SKIP_POSITIVE - SOCMED OR LINKEDIN WITH NUMBER',
          'SKIP_POSITIVE - ACTIVE VISA',
        ],
      },
      { key: 'negative', label: 'Negative', defaults: [] },
    ];
    const bankEntryFields = [
      ['woa', 'WOA'],
      ['newRpc', 'New RPC'],
      ['newPayment', 'New Payment'],
      ['newPtp', 'New PTP'],
      ['talktime', 'Talktime'],
      ['bankTarget', 'Bank Target'],
    ];
    let agentEntries = [];
    let bankEntries = [];
    let bankReferenceValues = {};
    let activeBankMonth = '';
    let activeSection = 'PTP Inventory';

    function getLocalDateValue() {
      const currentDate = new Date();
      const month = String(currentDate.getMonth() + 1).padStart(2, '0');
      const day = String(currentDate.getDate()).padStart(2, '0');
      return `${currentDate.getFullYear()}-${month}-${day}`;
    }

    agentReportDate.value = localStorage.getItem(agentDateStorageKey) || getLocalDateValue();
    agentReportDate.addEventListener('change', () => {
      if (agentReportDate.value) localStorage.setItem(agentDateStorageKey, agentReportDate.value);
    });

    replaceButton.addEventListener('click', () => fileInput.click());
    closeButton.addEventListener('click', () => preview.close());

    menuLinks.forEach((link) => {
      link.addEventListener('click', (event) => {
        event.preventDefault();
        activeSection = link.textContent.trim();
        history.replaceState(null, '', link.hash);
        updateCurrentLink();

        if (link.id === 'agent-details') {
          showAgentDetails();
          return;
        }

        if (link.id === 'bank-details') {
          showBankDetails();
          return;
        }

        if (link.id === 'bank-reference') {
          showBankReference();
          return;
        }

        calculateButton.hidden = true;
        addAgentRowButton.hidden = true;
        agentDateControl.hidden = true;
        bankMonthControl.hidden = true;
        bankReferenceChoiceControl.hidden = true;
        replaceButton.hidden = false;
        fileInput.click();
      });
    });

    function loadAgentEntries() {
      try {
        const savedEntries = JSON.parse(localStorage.getItem(agentEntriesStorageKey) || '[]');
        return Array.isArray(savedEntries)
          ? savedEntries.map((entry) => ({
            bank: String(entry.bank ?? ''),
            agent: String(entry.agent ?? ''),
            totalWa: entry.totalWa == null ? '' : String(entry.totalWa),
            rpc: entry.rpc == null ? '' : String(entry.rpc),
            negative: entry.negative == null ? '' : String(entry.negative),
            positive: entry.positive == null ? '' : String(entry.positive),
          }))
          : [];
      } catch {
        return [];
      }
    }

    function saveAgentEntries() {
      try {
        localStorage.setItem(agentEntriesStorageKey, JSON.stringify(agentEntries));
        const completeRows = agentEntries.filter((entry) => entry.bank.trim() && entry.agent.trim()).length;
        previewMeta.textContent = `${completeRows} manually ordered agents`;
        previewMessage.textContent = 'Agent details are saved in this browser.';
        return true;
      } catch {
        previewMessage.textContent = 'Changes could not be saved in this browser.';
        return false;
      }
    }

    function renderAgentEntries() {
      previewBody.replaceChildren();
      agentEntries.forEach((entry, index) => {
        const row = document.createElement('tr');
        [['bank', 'Bank'], ['agent', 'Agent name']].forEach(([field, label]) => {
          const cell = document.createElement('td');
          const input = document.createElement('input');
          input.className = 'agent-entry-input';
          input.type = 'text';
          input.value = entry[field];
          input.placeholder = label;
          input.setAttribute('aria-label', `${label}, row ${index + 1}`);
          input.addEventListener('input', () => {
            agentEntries[index][field] = input.value;
            if (field === 'agent' || field === 'bank') {
              agentEntries[index].rpc = '';
              agentEntries[index].negative = '';
              agentEntries[index].positive = '';
              row.cells[11].textContent = '';
              row.cells[12].textContent = '';
              row.cells[13].textContent = '';
            }
            if (field === 'agent') {
              agentEntries[index].totalWa = '';
              row.cells[10].textContent = '';
            }
            saveAgentEntries();
          });
          cell.append(input);
          row.append(cell);
        });

        for (let column = 0; column < 16; column += 1) {
          const cell = document.createElement('td');
          if (column === 8 && entry.totalWa !== '') {
            cell.textContent = new Intl.NumberFormat('en-US').format(Number(entry.totalWa));
          }
          if (column === 9 && entry.rpc !== '') {
            cell.textContent = new Intl.NumberFormat('en-US').format(Number(entry.rpc));
          }
          if (column === 10 && entry.negative !== '') {
            cell.textContent = new Intl.NumberFormat('en-US').format(Number(entry.negative));
          }
          if (column === 11 && entry.positive !== '') {
            cell.textContent = new Intl.NumberFormat('en-US').format(Number(entry.positive));
          }
          row.append(cell);
        }

        const actionCell = document.createElement('td');
        const deleteButton = document.createElement('button');
        deleteButton.className = 'delete-row';
        deleteButton.type = 'button';
        deleteButton.textContent = '×';
        deleteButton.setAttribute('aria-label', `Delete row ${index + 1}`);
        deleteButton.addEventListener('click', () => {
          agentEntries.splice(index, 1);
          saveAgentEntries();
          renderAgentEntries();
        });
        actionCell.append(deleteButton);
        row.append(actionCell);
        previewBody.append(row);
      });
    }

    function normalizeAgentKey(value) {
      return String(value ?? '')
        .normalize('NFKD')
        .replace(/\p{M}/gu, '')
        .toLocaleLowerCase()
        .replace(/\s+/g, ' ')
        .trim();
    }

    function normalizeAccountKey(value) {
      return String(value ?? '')
        .normalize('NFKD')
        .replace(/\p{M}/gu, '')
        .toLocaleLowerCase()
        .replace(/[^a-z0-9]/g, '');
    }

    function normalizeColumnHeader(value) {
      return String(value ?? '')
        .normalize('NFKD')
        .replace(/[\u0300-\u036f]/g, '')
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, ' ')
        .trim()
        .replace(/\s/g, '');
    }

    function normalizeStatusCode(value) {
      return String(value ?? '')
        .normalize('NFKD')
        .replace(/\p{M}/gu, '')
        .toLocaleLowerCase()
        .replace(/\s*-\s*/g, ' - ')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function getDailyRemarksColumnIndexes(headerRow) {
      const headers = headerRow.map(normalizeColumnHeader);
      const accountColumn = headers.findIndex((header) =>
        /^(?:(?:customer|client|loan|contract|debt))?(?:account|acct)(?:number|no|num|id)?$/.test(header));
      const agentColumn = headers.findIndex((header) => [
        'agent', 'agentname', 'agentfullname', 'assignedagent', 'assignedagentname',
        'collector', 'collectorname', 'disposedby', 'dispositionby', 'handledby',
        'username', 'staffname',
      ].includes(header));
      const statusCodeColumn = headers.findIndex((header) => header === 'statuscode');
      const dispositionColumn = statusCodeColumn >= 0 ? statusCodeColumn : headers.findIndex((header) => [
        'disposition', 'dispositionreason', 'dispositionremarks', 'dispositioncode',
        'remark', 'remarks', 'dailyremarks', 'callresult', 'result', 'reason', 'outcome',
      ].includes(header));

      if (accountColumn < 0 || agentColumn < 0) {
        throw new Error('Daily Remarks must include Account Number and Agent Name columns.');
      }
      return { accountColumn, agentColumn, statusCodeColumn: dispositionColumn };
    }

    function buildDailyRemarksWaSummary(rows) {
      if (!Array.isArray(rows) || rows.length < 2) {
        throw new Error('Daily Remarks contains no account records to calculate.');
      }

      const { accountColumn, agentColumn, statusCodeColumn } = getDailyRemarksColumnIndexes(rows[0]);
      const accountsByAgent = new Map();
      let dataRowCount = 0;
      rows.slice(1).forEach((row) => {
        const account = normalizeAccountKey(row[accountColumn]);
        const agent = String(row[agentColumn] ?? '').trim();
        const agentKey = normalizeAgentKey(agent);
        if (!account || !agentKey) return;
        dataRowCount += 1;
        if (!accountsByAgent.has(agentKey)) accountsByAgent.set(agentKey, new Map());
        const accounts = accountsByAgent.get(agentKey);
        if (!accounts.has(account)) accounts.set(account, new Set());
        if (statusCodeColumn >= 0) {
          const statusCode = normalizeStatusCode(row[statusCodeColumn]);
          if (statusCode) accounts.get(account).add(statusCode);
        }
      });

      if (!dataRowCount) {
        throw new Error('Daily Remarks contains no rows with both an account number and agent name.');
      }

      const counts = Object.fromEntries([...accountsByAgent].map(([agentKey, accounts]) => [
        agentKey,
        accounts.size,
      ]));
      const accountStatusGroups = Object.fromEntries([...accountsByAgent].map(([agentKey, accounts]) => {
        const groupedAccounts = new Map();
        accounts.forEach((statusCodes) => {
          const normalizedStatusCodes = [...statusCodes].sort();
          const signature = JSON.stringify(normalizedStatusCodes);
          if (!groupedAccounts.has(signature)) {
            groupedAccounts.set(signature, { statusCodes: normalizedStatusCodes, accounts: 0 });
          }
          groupedAccounts.get(signature).accounts += 1;
        });
        return [agentKey, [...groupedAccounts.values()]];
      }));
      const uniqueAccountAgentPairs = [...accountsByAgent.values()]
        .reduce((total, accounts) => total + accounts.size, 0);
      return {
        counts,
        accountStatusGroups,
        hasStatusCodeColumn: statusCodeColumn >= 0,
        dataRowCount,
        uniqueAccountAgentPairs,
      };
    }

    function loadDailyRemarksWaSummaries() {
      try {
        const summaries = JSON.parse(localStorage.getItem(dailyRemarksWaStorageKey) || '{}');
        return summaries && typeof summaries === 'object' && !Array.isArray(summaries) ? summaries : {};
      } catch {
        return {};
      }
    }

    function saveDailyRemarksWaSummary(date, summary) {
      try {
        const summaries = loadDailyRemarksWaSummaries();
        summaries[date] = summary;
        localStorage.setItem(dailyRemarksWaStorageKey, JSON.stringify(summaries));
        return true;
      } catch {
        previewMessage.textContent = 'Daily Remarks counts could not be saved in this browser.';
        return false;
      }
    }

    function countUniqueAccountsByReferenceCategory(summary, agentKey, bank, category) {
      const referenceCodes = new Set(getBankReferenceValues(bank)[category]
        .map(normalizeStatusCode)
        .filter(Boolean));
      if (!referenceCodes.size) return 0;

      const groups = summary.accountStatusGroups?.[agentKey]
        || summary.accountDispositionGroups?.[agentKey]
        || [];
      return groups.reduce((total, group) => {
        const statusCodes = group.statusCodes || group.dispositions;
        const matchesReference = Array.isArray(statusCodes)
          && statusCodes.some((statusCode) => referenceCodes.has(normalizeStatusCode(statusCode)));
        return matchesReference ? total + Number(group.accounts || 0) : total;
      }, 0);
    }

    calculateButton.addEventListener('click', () => {
      const reportDate = agentReportDate.value;
      const summary = loadDailyRemarksWaSummaries()[reportDate];
      if (!summary || !summary.counts) {
        previewMessage.textContent = `Upload Daily Remarks for ${reportDate} before calculating Total WA.`;
        return;
      }

      agentEntries = agentEntries.map((entry) => {
        const agentKey = normalizeAgentKey(entry.agent);
        const bank = String(entry.bank ?? '').trim();
        const hasStatusCodeColumn = summary.hasStatusCodeColumn ?? summary.hasDispositionColumn;
        return {
          ...entry,
          totalWa: agentKey ? String(summary.counts[agentKey] ?? 0) : '',
          rpc: agentKey && bank && hasStatusCodeColumn
            ? String(countUniqueAccountsByReferenceCategory(summary, agentKey, bank, 'rpc'))
            : '',
          negative: agentKey && bank && hasStatusCodeColumn
            ? String(countUniqueAccountsByReferenceCategory(summary, agentKey, bank, 'negative'))
            : '',
          positive: agentKey && bank && hasStatusCodeColumn
            ? String(countUniqueAccountsByReferenceCategory(summary, agentKey, bank, 'positive'))
            : '',
        };
      });
      if (!saveAgentEntries()) return;
      renderAgentEntries();
      const calculatedAgents = agentEntries.filter((entry) => entry.bank.trim() && entry.agent.trim()).length;
      const hasStatusCodeColumn = summary.hasStatusCodeColumn ?? summary.hasDispositionColumn;
      previewMessage.textContent = hasStatusCodeColumn
        ? `Total WA, RPC, Negative, and Positive calculated for ${calculatedAgents} agents from ${summary.uniqueAccountAgentPairs} unique account-agent pairs on ${reportDate}.`
        : `Total WA calculated for ${calculatedAgents} agents on ${reportDate}. Re-upload Daily Remarks with a Status Code column to calculate RPC, Negative, and Positive.`;
    });

    function showAgentDetails() {
      agentEntries = loadAgentEntries();
      if (!agentEntries.length) agentEntries = [{ bank: '', agent: '' }];
      previewTitle.textContent = 'Agent Details';
      agentDateControl.hidden = false;
      bankMonthControl.hidden = true;
      bankReferenceChoiceControl.hidden = true;
      agentReportDate.value = localStorage.getItem(agentDateStorageKey) || getLocalDateValue();
      previewMeta.textContent = `${agentEntries.filter((entry) => entry.bank.trim() && entry.agent.trim()).length} manually ordered agents`;
      previewMessage.textContent = 'Enter Bank and Agent names in your preferred order.';
      previewHead.replaceChildren();
      previewTableWrap.hidden = false;
      previewTable.classList.add('agent-report');
      previewTable.classList.remove('bank-report');
      previewTable.classList.remove('bank-reference');
      calculateButton.hidden = false;
      addAgentRowButton.hidden = false;
      replaceButton.hidden = true;

      const groupHeader = document.createElement('tr');
      [
        { label: 'BANK', rowSpan: 2 },
        { label: 'AGENT NAME', rowSpan: 2 },
        { label: 'PARTIAL PAYMENT', colSpan: 4 },
        { label: 'SPP', colSpan: 4 },
        { label: 'TOTALS', colSpan: 7 },
        { label: 'TIME', rowSpan: 2 },
        { label: 'DELETE', rowSpan: 2 },
      ].forEach(({ label, rowSpan, colSpan }) => {
        const cell = document.createElement('th');
        cell.scope = 'col';
        cell.textContent = label;
        cell.className = 'group-heading';
        if (rowSpan) cell.rowSpan = rowSpan;
        if (colSpan) cell.colSpan = colSpan;
        groupHeader.append(cell);
      });
      const columnHeader = document.createElement('tr');
      [
        'PTP COUNT', 'PTP AMOUNT', 'PAYMENT COUNT', 'PAYMENT AMOUNT',
        'PTP COUNT', 'PTP AMOUNT', 'PAYMENT COUNT', 'PAYMENT AMOUNT',
        'TOTAL WA', 'RPC', 'NEGATIVE', 'POSITIVE', 'NEW RPC', 'NEW PTP', 'NEW PAYMENT',
      ].forEach((label) => {
        const cell = document.createElement('th');
        cell.scope = 'col';
        cell.textContent = label;
        columnHeader.append(cell);
      });
      previewHead.append(groupHeader, columnHeader);
      renderAgentEntries();

      if (!preview.open) preview.showModal();
    }

    addAgentRowButton.addEventListener('click', () => {
      if (activeSection === 'Bank Details') {
        bankEntries.push(createBankEntry());
        renderBankEntries();
        previewBody.querySelector('tr:last-child .bank-entry-input')?.focus();
        return;
      }

      agentEntries.push({ bank: '', agent: '' });
      saveAgentEntries();
      renderAgentEntries();
      previewBody.querySelector('tr:last-child .agent-entry-input')?.focus();
    });

    function createBankEntry(entry = {}) {
      const bankEntry = {
        bank: String(entry.bank ?? ''),
        savedBank: String(entry.bank ?? ''),
        confirmed: Boolean(entry.bank),
      };
      bankEntryFields.forEach(([field]) => {
        bankEntry[field] = entry[field] == null ? '' : String(entry[field]);
      });
      return bankEntry;
    }

    function loadBankDetails() {
      try {
        const savedDetails = JSON.parse(localStorage.getItem(bankDetailsStorageKey) || '{}');
        return savedDetails && typeof savedDetails === 'object' && !Array.isArray(savedDetails)
          ? savedDetails
          : {};
      } catch {
        return {};
      }
    }

    function getSavedBankEntries(month) {
      const savedDetails = loadBankDetails();
      const entries = savedDetails[month];
      return Array.isArray(entries)
        ? entries
          .filter((entry) => entry && typeof entry === 'object' && String(entry.bank ?? '').trim())
          .map((entry) => createBankEntry(entry))
        : [];
    }

    function saveBankDetails(savedDetails) {
      try {
        localStorage.setItem(bankDetailsStorageKey, JSON.stringify(savedDetails));
        return true;
      } catch {
        previewMessage.textContent = 'Bank details could not be saved in this browser.';
        return false;
      }
    }

    function updateBankEntry(index) {
      const entry = bankEntries[index];
      const bank = entry.bank.trim();
      if (!bank) {
        previewMessage.textContent = 'Enter a bank name before confirming this row.';
        return;
      }

      const values = {};
      for (const [field, label] of bankEntryFields) {
        const value = entry[field].trim();
        if (!value || !Number.isFinite(Number(value)) || Number(value) < 0) {
          previewMessage.textContent = `Enter a non-negative number for ${label} before confirming this row.`;
          return;
        }
        values[field] = Number(value);
      }

      const savedDetails = loadBankDetails();
      const currentEntries = Array.isArray(savedDetails[activeBankMonth])
        ? savedDetails[activeBankMonth]
        : [];
      const replacedNames = new Set([entry.savedBank.toLocaleLowerCase(), bank.toLocaleLowerCase()]);
      const updatedEntries = currentEntries.filter((savedEntry) =>
        !replacedNames.has(String(savedEntry?.bank ?? '').trim().toLocaleLowerCase()));
      updatedEntries.push({ bank, ...values });
      savedDetails[activeBankMonth] = updatedEntries;
      if (!saveBankDetails(savedDetails)) return;

      entry.bank = bank;
      entry.savedBank = bank;
      entry.confirmed = true;
      previewMeta.textContent = `${updatedEntries.length} banks saved for ${activeBankMonth}`;
      previewMessage.textContent = `${bank} targets confirmed and saved for ${activeBankMonth}. Productivity targets update when that month and bank are selected.`;
      renderBankEntries();
    }

    function deleteBankEntry(index) {
      const entry = bankEntries[index];
      if (entry.savedBank) {
        const savedDetails = loadBankDetails();
        const currentEntries = Array.isArray(savedDetails[activeBankMonth])
          ? savedDetails[activeBankMonth]
          : [];
        savedDetails[activeBankMonth] = currentEntries.filter((savedEntry) =>
          String(savedEntry?.bank ?? '').trim().toLocaleLowerCase()
            !== entry.savedBank.toLocaleLowerCase());
        if (!saveBankDetails(savedDetails)) return;
      }

      bankEntries.splice(index, 1);
      renderBankEntries();
      previewMessage.textContent = 'Bank row deleted.';
    }

    function renderBankEntries() {
      previewBody.replaceChildren();
      bankEntries.forEach((entry, index) => {
        const row = document.createElement('tr');
        const bankCell = document.createElement('td');
        const bankInput = document.createElement('input');
        bankInput.className = 'agent-entry-input';
        bankInput.type = 'text';
        bankInput.value = entry.bank;
        bankInput.placeholder = 'Bank';
        bankInput.setAttribute('aria-label', `Bank, row ${index + 1}`);
        bankInput.addEventListener('input', () => {
          entry.bank = bankInput.value;
          entry.confirmed = false;
          previewMessage.textContent = 'Confirm edited rows to save their updated targets.';
        });
        bankCell.append(bankInput);
        row.append(bankCell);

        bankEntryFields.forEach(([field, label]) => {
          const cell = document.createElement('td');
          const input = document.createElement('input');
          input.className = 'bank-entry-input';
          input.type = 'number';
          input.min = '0';
          input.step = 'any';
          input.value = entry[field];
          input.setAttribute('aria-label', `${label}, ${entry.bank || `row ${index + 1}`}`);
          input.addEventListener('input', () => {
            entry[field] = input.value;
            entry.confirmed = false;
            previewMessage.textContent = 'Confirm edited rows to save their updated targets.';
          });
          cell.append(input);
          row.append(cell);
        });

        const confirmCell = document.createElement('td');
        const confirmButton = document.createElement('button');
        confirmButton.className = 'confirm-row';
        confirmButton.type = 'button';
        confirmButton.textContent = entry.confirmed ? 'Confirmed' : 'Confirm';
        confirmButton.addEventListener('click', () => updateBankEntry(index));
        confirmCell.append(confirmButton);
        row.append(confirmCell);

        const deleteCell = document.createElement('td');
        const deleteButton = document.createElement('button');
        deleteButton.className = 'delete-row';
        deleteButton.type = 'button';
        deleteButton.textContent = '×';
        deleteButton.setAttribute('aria-label', `Delete bank row ${index + 1}`);
        deleteButton.addEventListener('click', () => deleteBankEntry(index));
        deleteCell.append(deleteButton);
        row.append(deleteCell);
        previewBody.append(row);
      });
    }

    function renderBankDetailsHeader() {
      previewHead.replaceChildren();
      const groupHeader = document.createElement('tr');
      [
        { label: 'BANK', rowSpan: 2 },
        { label: 'TARGET PRODUCTIVITY', colSpan: 5 },
        { label: 'BANK TARGET', rowSpan: 2 },
        { label: 'CONFIRM', rowSpan: 2 },
        { label: 'DELETE', rowSpan: 2 },
      ].forEach(({ label, rowSpan, colSpan }) => {
        const cell = document.createElement('th');
        cell.scope = 'col';
        cell.textContent = label;
        cell.className = 'group-heading';
        if (rowSpan) cell.rowSpan = rowSpan;
        if (colSpan) cell.colSpan = colSpan;
        groupHeader.append(cell);
      });
      const columnHeader = document.createElement('tr');
      ['WOA', 'NEW RPC', 'NEW PAYMENT', 'NEW PTP', 'TALKTIME'].forEach((label) => {
        const cell = document.createElement('th');
        cell.scope = 'col';
        cell.textContent = label;
        columnHeader.append(cell);
      });
      previewHead.append(groupHeader, columnHeader);
    }

    function loadBankMonth(month) {
      activeBankMonth = month;
      bankEntries = getSavedBankEntries(month);
      if (!bankEntries.length) bankEntries = [createBankEntry()];
      previewMeta.textContent = `${bankEntries.filter((entry) => entry.confirmed).length} banks saved for ${month}`;
      previewMessage.textContent = 'Enter monthly bank targets and confirm each row to save and update Productivity.';
      renderBankEntries();
    }

    function showBankDetails() {
      previewTitle.textContent = 'Bank Details';
      agentDateControl.hidden = true;
      bankMonthControl.hidden = false;
      bankReferenceChoiceControl.hidden = true;
      previewTableWrap.hidden = false;
      previewTable.classList.remove('agent-report');
      previewTable.classList.remove('bank-reference');
      previewTable.classList.add('bank-report');
      calculateButton.hidden = true;
      addAgentRowButton.hidden = false;
      addAgentRowButton.textContent = 'Add row';
      replaceButton.hidden = true;
      renderBankDetailsHeader();
      const currentMonth = new Date();
      bankReportMonth.value = `${currentMonth.getFullYear()}-${String(currentMonth.getMonth() + 1).padStart(2, '0')}`;
      loadBankMonth(bankReportMonth.value);
      if (!preview.open) preview.showModal();
    }

    bankReportMonth.addEventListener('change', () => {
      if (bankReportMonth.value) loadBankMonth(bankReportMonth.value);
    });

    function loadBankReferences() {
      try {
        const savedReferences = JSON.parse(localStorage.getItem(bankReferenceStorageKey) || '{}');
        return savedReferences && typeof savedReferences === 'object' && !Array.isArray(savedReferences)
          ? savedReferences
          : {};
      } catch {
        return {};
      }
    }

    function getBankReferenceBanks() {
      const bankNames = new Map();
      Object.values(loadBankDetails()).forEach((entries) => {
        if (!Array.isArray(entries)) return;
        entries.forEach((entry) => {
          const bank = String(entry?.bank ?? '').trim();
          const bankKey = bank.toLocaleLowerCase();
          if (bank && !bankNames.has(bankKey)) bankNames.set(bankKey, bank);
        });
      });
      return [...bankNames.values()].sort((first, second) => first.localeCompare(second));
    }

    function getBankReferenceValues(bank) {
      const savedReferences = loadBankReferences();
      const savedBank = Object.keys(savedReferences)
        .find((referenceBank) => referenceBank.toLocaleLowerCase() === bank.toLocaleLowerCase());
      if (savedBank === undefined) {
        return Object.fromEntries(bankReferenceCategories.map(({ key, defaults }) => [key, [...defaults]]));
      }

      const savedValues = savedReferences[savedBank];
      if (!savedValues || typeof savedValues !== 'object' || Array.isArray(savedValues)) {
        return Object.fromEntries(bankReferenceCategories.map(({ key }) => [key, []]));
      }
      return Object.fromEntries(bankReferenceCategories.map(({ key }) => [
        key,
        Array.isArray(savedValues[key]) ? savedValues[key].map((value) => String(value)) : [],
      ]));
    }

    function saveBankReferences(savedReferences) {
      try {
        localStorage.setItem(bankReferenceStorageKey, JSON.stringify(savedReferences));
        return true;
      } catch {
        previewMessage.textContent = 'Bank references could not be saved in this browser.';
        return false;
      }
    }

    function renderBankReferenceHeader() {
      previewHead.replaceChildren();
      const headerRow = document.createElement('tr');
      [
        ...bankReferenceCategories.map(({ label }) => label),
        'Confirm',
        'Delete',
      ].forEach((label) => {
        const cell = document.createElement('th');
        cell.scope = 'col';
        cell.textContent = label;
        headerRow.append(cell);
      });
      previewHead.append(headerRow);
    }

    function renderBankReferenceRow() {
      previewBody.replaceChildren();
      const bank = bankReferenceBank.value;
      if (!bank) return;

      const row = document.createElement('tr');
      bankReferenceCategories.forEach(({ key, label }) => {
        const cell = document.createElement('td');
        const input = document.createElement('textarea');
        input.className = 'bank-reference-input';
        input.value = bankReferenceValues[key].join('\n');
        input.setAttribute('aria-label', `${label} references for ${bank}`);
        input.addEventListener('input', () => {
          bankReferenceValues[key] = input.value.split(/\r?\n/).map((value) => value.trim());
        });
        cell.append(input);
        row.append(cell);
      });

      const confirmCell = document.createElement('td');
      const confirmButton = document.createElement('button');
      confirmButton.className = 'confirm-row';
      confirmButton.type = 'button';
      confirmButton.textContent = 'Confirm';
      confirmButton.addEventListener('click', () => {
        const savedReferences = loadBankReferences();
        savedReferences[bank] = Object.fromEntries(bankReferenceCategories.map(({ key }) => [
          key,
          bankReferenceValues[key].map((value) => value.trim()).filter(Boolean),
        ]));
        if (!saveBankReferences(savedReferences)) return;
        previewMeta.textContent = `References saved for ${bank}`;
        previewMessage.textContent = `Bank references confirmed and saved for ${bank}.`;
      });
      confirmCell.append(confirmButton);
      row.append(confirmCell);

      const deleteCell = document.createElement('td');
      const deleteButton = document.createElement('button');
      deleteButton.className = 'delete-row';
      deleteButton.type = 'button';
      deleteButton.textContent = '×';
      deleteButton.setAttribute('aria-label', `Delete references for ${bank}`);
      deleteButton.addEventListener('click', () => {
        const savedReferences = loadBankReferences();
        savedReferences[bank] = null;
        if (!saveBankReferences(savedReferences)) return;
        bankReferenceValues = Object.fromEntries(bankReferenceCategories.map(({ key }) => [key, []]));
        renderBankReferenceRow();
        previewMeta.textContent = `References cleared for ${bank}`;
        previewMessage.textContent = `Bank reference values deleted for ${bank}.`;
      });
      deleteCell.append(deleteButton);
      row.append(deleteCell);
      previewBody.append(row);
    }

    function loadBankReferenceBank(bank) {
      bankReferenceValues = getBankReferenceValues(bank);
      renderBankReferenceRow();
      previewMeta.textContent = bank ? `Bank reference for ${bank}` : 'No Bank Details choices available';
      previewMessage.textContent = bank
        ? 'Edit the reference choices and confirm to save them for this bank.'
        : 'Confirm a bank in Bank Details first to add it to Bank Choices.';
    }

    function populateBankReferenceChoices(preferredBank = '') {
      const banks = getBankReferenceBanks();
      bankReferenceBank.replaceChildren();
      const placeholder = document.createElement('option');
      placeholder.value = '';
      placeholder.textContent = banks.length ? 'Select a bank' : 'No banks available';
      bankReferenceBank.append(placeholder);
      banks.forEach((bank) => {
        const option = document.createElement('option');
        option.value = bank;
        option.textContent = bank;
        bankReferenceBank.append(option);
      });
      bankReferenceBank.disabled = banks.length === 0;
      bankReferenceBank.value = banks.some((bank) => bank === preferredBank) ? preferredBank : banks[0] || '';
      loadBankReferenceBank(bankReferenceBank.value);
    }

    function showBankReference() {
      previewTitle.textContent = 'Bank Reference';
      agentDateControl.hidden = true;
      bankMonthControl.hidden = true;
      bankReferenceChoiceControl.hidden = false;
      previewTableWrap.hidden = false;
      previewTable.classList.remove('agent-report', 'bank-report');
      previewTable.classList.add('bank-reference');
      calculateButton.hidden = true;
      addAgentRowButton.hidden = true;
      replaceButton.hidden = true;
      renderBankReferenceHeader();
      populateBankReferenceChoices(bankReferenceBank.value);
      if (!preview.open) preview.showModal();
    }

    bankReferenceBank.addEventListener('change', () => loadBankReferenceBank(bankReferenceBank.value));

    function updateCurrentLink() {
      menuLinks.forEach((link) => {
        if (link.hash === window.location.hash) {
          link.setAttribute('aria-current', 'location');
        } else {
          link.removeAttribute('aria-current');
        }
      });
    }

    window.addEventListener('hashchange', updateCurrentLink);
    updateCurrentLink();

    function getSensitiveColumnType(header) {
      const normalizedHeader = String(header ?? '')
        .normalize('NFKD')
        .replace(/[\u0300-\u036f]/g, '')
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, ' ')
        .trim();
      const compactHeader = normalizedHeader.replace(/\s/g, '');
      const nameHeaders = [
        'name', 'customer', 'customername', 'customerfullname',
        'cust', 'custname', 'custfullname',
        'client', 'clientname', 'clientfullname',
        'debtor', 'debtorname', 'debtorfullname',
        'accountname', 'accountholder', 'accountholdername',
        'borrowername', 'borrowerfullname',
      ];

      if (nameHeaders.includes(compactHeader)
        || /^(customer|cust|client|debtor|borrower)(full)?name/.test(compactHeader)
        || /^(account|acct)(holder)?name/.test(compactHeader)) return 'name';
      if (/(?:^|\s)(?:account|acct)\s*(?:number|no|num|id)(?:\s|$)/.test(normalizedHeader)
        || /(?:^|\s)a\s+c\s*(?:number|no|num|id)(?:\s|$)/.test(normalizedHeader)
        || ['account', 'acct'].includes(compactHeader)) return 'account';
      return '';
    }

    function maskCustomerName(value) {
      const name = String(value ?? '').trim();
      const familyName = name.includes(',') ? name.split(',')[0] : name;
      return familyName.trim().split(/\s+/).filter(Boolean).at(-1) || '';
    }

    function maskAccountNumber(value) {
      const accountNumber = String(value ?? '');
      const digitCount = (accountNumber.match(/\d/g) || []).length;
      let digitIndex = 0;
      return accountNumber.replace(/[A-Za-z0-9]/g, (character) => {
        if (!/\d/.test(character)) return '*';
        const index = digitIndex++;
        return digitCount > 10 && (index < 6 || index >= digitCount - 4) ? character : '*';
      });
    }

    fileInput.addEventListener('change', async () => {
      const file = fileInput.files?.[0];
      if (!file) return;
      fileInput.value = '';

      if (!preview.open) preview.showModal();
      previewTitle.textContent = `${activeSection} Preview`;
      agentDateControl.hidden = activeSection !== 'Daily Remarks';
      bankMonthControl.hidden = true;
      bankReferenceChoiceControl.hidden = true;
      previewMeta.textContent = file.name;
      previewMessage.textContent = 'Reading workbook…';
      previewTableWrap.hidden = true;
      previewTable.classList.remove('agent-report', 'bank-report', 'bank-reference');
      calculateButton.hidden = true;
      addAgentRowButton.hidden = true;
      previewHead.replaceChildren();
      previewBody.replaceChildren();

      try {
        if (!window.XLSX) throw new Error('Excel preview could not load. Check your internet connection and try again.');
        const workbook = XLSX.read(await file.arrayBuffer(), { type: 'array' });
        const sheetName = workbook.SheetNames[0];
        if (!sheetName) throw new Error('This workbook does not contain a worksheet.');

        const rows = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName], { header: 1, raw: false, defval: '' });
        if (!rows.length) throw new Error('The first worksheet is empty.');

        let dailyRemarksSummary = null;
        if (activeSection === 'Daily Remarks') {
          if (!agentReportDate.value) throw new Error('Select a report date for Daily Remarks.');
          dailyRemarksSummary = buildDailyRemarksWaSummary(rows);
          if (!saveDailyRemarksWaSummary(agentReportDate.value, dailyRemarksSummary)) {
            throw new Error('Daily Remarks counts could not be saved in this browser.');
          }
        }

        const previewRows = rows;
        const columnCount = previewRows.reduce((maximum, row) => Math.max(maximum, row.length), 0);
        const headerRow = previewRows[0];
        const sensitiveColumns = headerRow.map((value) => getSensitiveColumnType(value));
        const header = document.createElement('tr');
        for (let column = 0; column < columnCount; column += 1) {
          const cell = document.createElement('th');
          cell.scope = 'col';
          cell.textContent = String(headerRow[column] || `Column ${column + 1}`);
          header.append(cell);
        }
        previewHead.append(header);

        const visibleRows = previewRows.slice(1, 51);
        visibleRows.forEach((row) => {
          const tableRow = document.createElement('tr');
          for (let column = 0; column < columnCount; column += 1) {
            const cell = document.createElement('td');
            const value = row[column] ?? '';
            const sensitiveType = sensitiveColumns[column];
            cell.textContent = sensitiveType === 'name'
              ? maskCustomerName(value)
              : sensitiveType === 'account' ? maskAccountNumber(value) : String(value);
            tableRow.append(cell);
          }
          previewBody.append(tableRow);
        });

        const dataRowCount = Math.max(0, previewRows.length - 1);
        const rowLabel = dataRowCount === 1 ? 'row' : 'rows';
        previewMeta.textContent = `${file.name} · ${sheetName} · ${dataRowCount} ${rowLabel} · ${columnCount} columns`;
        const rowLimitMessage = dataRowCount > visibleRows.length ? `Showing the first ${visibleRows.length} rows.` : '';
        const maskedColumnCount = sensitiveColumns.filter(Boolean).length;
        const maskingMessage = maskedColumnCount
          ? `${maskedColumnCount} sensitive ${maskedColumnCount === 1 ? 'column' : 'columns'} masked in preview.`
          : '';
        const dailyRemarksMessage = dailyRemarksSummary
          ? `Total WA counts for ${dailyRemarksSummary.uniqueAccountAgentPairs} unique account-agent pairs saved for ${agentReportDate.value}.`
          : '';
        previewMessage.textContent = [rowLimitMessage, maskingMessage, dailyRemarksMessage].filter(Boolean).join(' ');
        previewTableWrap.hidden = false;
      } catch (error) {
        previewMeta.textContent = file.name;
        previewMessage.textContent = error instanceof Error ? error.message : 'Unable to preview this workbook.';
      }
    });
  </script>
</body>
